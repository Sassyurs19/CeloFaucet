services:
  - type: web
    name: celo-faucet-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DRY_RUN
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CELO_RPC_URL
        value: https://forno.celo.org
      - key: USAT_CONTRACT_ADDRESS
        value: 0xd2ab3c9a02dbbab236bfec45d1d755df4267f771
      - key: MIN_USER_CELO_THRESHOLD
        value: 0.005
      - key: CELO_FUNDING_AMOUNT
        value: 0.05
      - key: FRONTEND_URL
        sync: false
      - key: WALLET_ENCRYPTION_KEY
        sync: false
      - key: FUNDING_WALLET_PRIVATE_KEY
        sync: false
      - key: FUNDING_WALLET_ADDRESS
        sync: false
